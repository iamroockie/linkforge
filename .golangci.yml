version: "2"

run:
  issues-exit-code: 1
  modules-download-mode: readonly
  relative-path-mode: gomod
  tests: true
  timeout: 3m

issues:
  max-issues-per-linter: 10
  max-same-issues: 3
  uniq-by-line: true

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - localmodule
      custom-order: true

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupl
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - gochecknoglobals
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - lll
    - mirror
    - misspell
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unused
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [dupl, errcheck, gocognit, gosec, noctx, nolintlint]
  settings:
    embeddedstructfieldcheck:
      forbid-mutex: true
    gocognit:
      min-complexity: 15
    lll:
      tab-width: 4
      line-length: 100
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    testifylint:
      enable-all: true

output:
  formats:
    text:
      colors: true
      print-issued-lines: true
      print-linter-name: true
